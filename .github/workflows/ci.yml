# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides whether this run publishes a release. A push to main releases the newest CHANGELOG.md version
  # ("## [1.12.0-beta.2] - 2026-10-28 · optional title") once no release exists for it yet; pushing its tag by
  # hand still works. "## [Unreleased]" on top releases nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $top = [regex]::Match($changelog, '(?m)^## \[([^\]]+)\]').Groups[1].Value
          $version = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main' -and $top -and $top -ne 'Unreleased') { $version = $top }
          $release = $false
          if ($version) {
            $prefix = [regex]::Match((Get-Content Directory.Build.props -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
            if (($version -split '[-+]')[0] -ne $prefix) { throw "CHANGELOG/tag version $version does not match VersionPrefix $prefix in Directory.Build.props." }
            gh release view "v$version" --json tagName 2>$null | Out-Null
            $release = $LASTEXITCODE -ne 0
            if (-not $release) { Write-Host "Release v$version already exists; nothing to publish." }
          }
          $global:LASTEXITCODE = 0
          Write-Host "version=$version release=$release"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EncoDeck.slnx

      - name: Build libraries, Probe and tests
        run: dotnet build EncoDeck.slnx -c Release --no-restore

      # EncoDeck.LeHook.dll (Labs LE Audio bitrate) is built with MinGW-w64 gcc during the x64 app build.
      - name: MinGW-w64
        shell: pwsh
        run: ./build/ensure-mingw.ps1

      - name: Build app (x64)
        run: dotnet build src/EncoDeck.App -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/EncoDeck.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  package:
    needs: [version, build-test]
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: MinGW-w64
        shell: pwsh
        run: ./build/ensure-mingw.ps1

      - name: Publish app (win-x64, self-contained, unpackaged)
        shell: pwsh
        run: |
          # A pre-release (1.11.0-beta.1) keeps its suffix; a CI build is ci.<run>.
          $suffix = if (-not $env:RELEASE_VERSION) { "ci.$env:GITHUB_RUN_NUMBER" } elseif ($env:RELEASE_VERSION -match '-(.+)$') { $Matches[1] } else { '' }
          dotnet publish src/EncoDeck.App -c Release -r win-x64 -p:Platform=x64 -p:VersionSuffix=$suffix -o artifacts/EncoDeck-win-x64
          dotnet publish tools/EncoDeck.Probe -c Release -r win-x64 --self-contained -p:VersionSuffix=$suffix -o artifacts/EncoDeck.Probe-win-x64
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md, README_EN.md artifacts/EncoDeck-win-x64/
          Copy-Item LICENSE artifacts/EncoDeck.Probe-win-x64/
          foreach ($f in 'EncoDeck.exe', 'EncoDeck.pri', 'Microsoft.WindowsAppRuntime.dll', 'Microsoft.ui.xaml.dll', 'EncoDeck.LeHook.dll') {
            if (-not (Test-Path "artifacts/EncoDeck-win-x64/$f")) { throw "Missing $f in publish output" }
          }
          Compress-Archive artifacts/EncoDeck-win-x64/* artifacts/EncoDeck-win-x64.zip
          Compress-Archive artifacts/EncoDeck.Probe-win-x64/* artifacts/EncoDeck.Probe-win-x64.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          $prefix = [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { "$prefix-ci.$env:GITHUB_RUN_NUMBER" }
          ./build/build-installer.ps1 -SkipTests -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: EncoDeck-win-x64
          path: |
            artifacts/EncoDeck-win-x64.zip
            artifacts/EncoDeck.Probe-win-x64.zip
            artifacts/installer/*.exe
            artifacts/installer/*.sha256

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes in a row must not both publish the same version.
    concurrency:
      group: release-${{ needs.version.outputs.version }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Components (LHDC, A2DP Bridge) have their own releases (components.yml). An app must not ship a pin
      # that cannot be downloaded: check every pinned package is published with exactly its size and digest.
      - name: Verify component pins
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/verify-components.ps1

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\]([^\r\n]*)\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          $notes = $section.Groups[2].Value.Trim()
          if (-not $notes) { throw "Release notes missing for $env:VERSION." }
          Set-Content release-notes.md $notes -Encoding utf8
          # "## [1.12.0] - 2026-10-28 · Title" names the release "EncoDeck 1.12.0 · Title".
          $title = [regex]::Match($section.Groups[1].Value, '\u00B7\s*(.+?)\s*$').Groups[1].Value
          "name=EncoDeck $env:VERSION$(if ($title) { " · $title" })" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: EncoDeck-win-x64
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/EncoDeck-win-x64.zip
            dist/EncoDeck.Probe-win-x64.zip
            dist/installer/*.exe
            dist/installer/*.sha256

  # Microsoft Store: build the MSIX bundle and submit it to Partner Center (certification + publish).
  # Uses build/submit-store.ps1 (Partner Center submission API). Needs the STORE_* secrets from a Microsoft Entra app added in Partner Center (Account settings →
  # User management → Microsoft Entra applications, role Manager). Without them the job is skipped.
  # Also runnable by hand (Actions → CI → Run workflow) to resubmit the version in Directory.Build.props.
  store:
    # Pre-releases (1.11.0-beta.1) are GitHub-only; the Store gets stable versions.
    if: (needs.version.outputs.release == 'true' && !contains(needs.version.outputs.version, '-')) || github.event_name == 'workflow_dispatch'
    needs: [version, build-test]
    runs-on: windows-latest
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.STORE_TENANT_ID != ''

      - uses: actions/setup-dotnet@v4
        if: env.STORE_TENANT_ID != ''
        with:
          global-json-file: global.json

      - name: Build Store package
        if: env.STORE_TENANT_ID != ''
        shell: pwsh
        run: |
          dotnet restore src/EncoDeck.App
          $props = Get-Content Directory.Build.props -Raw
          $version = if ('${{ needs.version.outputs.version }}') { '${{ needs.version.outputs.version }}' } else { [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value }
          ./build/build-msix.ps1 -SkipTests -Version $version
          # Keep the upload apart from the build output.
          New-Item -ItemType Directory -Force artifacts/store | Out-Null
          Move-Item artifacts/*.msixupload artifacts/store/

      - name: Submit to Microsoft Store
        if: env.STORE_TENANT_ID != ''
        shell: pwsh
        env:
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $version = [regex]::Match((Get-Content Directory.Build.props -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern).Groups[1].Value.Trim()
          if (-not $notes) { throw "Release notes missing for $version." }
          # Store release notes are plain text: turn "### 新增" into "【新增】" and keep link text only.
          $notes = $notes -replace '(?m)^### (.+?)\s*$', '【$1】' -replace '\[([^\]]+)\]\([^)]+\)', '$1' -replace '`', ''
          ./build/submit-store.ps1 -Package (Get-ChildItem artifacts/store/*.msixupload | Select-Object -First 1).FullName -ReleaseNotes $notes `
            -ReleaseNotesUrl "https://github.com/TIANLI0/EncoDeck/releases/tag/v$version" -ReplacePending

      - uses: actions/upload-artifact@v4
        if: env.STORE_TENANT_ID != ''
        with:
          name: EncoDeck-msixupload
          path: artifacts/store/*.msixupload
